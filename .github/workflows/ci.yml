name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.name }}
    concurrency:
      group: native-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, name: linux-x64, ext: ''}
          - {os: ubuntu-22.04-arm, name: linux-arm64, ext: ''}
          - {os: macos-15, name: macos-arm64, ext: ''}
          - {os: macos-15-intel, name: macos-x64, ext: ''}
          - {os: windows-2022, name: windows-x64, ext: '.exe'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.m2/repository
            .cache
          key: deps-${{ matrix.name }}-${{ hashFiles('upstream.lock.json') }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential zlib1g-dev
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '543.0.0'
      - name: Download checksum-pinned lmgcp
        run: python scripts/download-client.py
      - name: JVM build and real client tests
        run: |
          python scripts/build.py
          python scripts/test-cli.py dist/quarkus-app/quarkus-run.jar
          python scripts/test-lifecycle.py dist/quarkus-app/quarkus-run.jar
          python scripts/test-gcloud.py dist/quarkus-app/quarkus-run.jar
          python scripts/test-auth.py dist/quarkus-app/quarkus-run.jar 'dist/lmgcp${{ matrix.ext }}'
      - name: Fingerprint native toolchain
        id: toolchain
        run: |
          python -c "import hashlib,os,shutil,subprocess; output=subprocess.check_output([shutil.which('native-image'), '--version']); open(os.environ['GITHUB_OUTPUT'],'a').write('sha='+hashlib.sha256(output).hexdigest()+'\n')"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: dist/gcpsim${{ matrix.ext }}
          key: native-${{ matrix.name }}-${{ steps.toolchain.outputs.sha }}-${{ hashFiles('src/**', 'VERSION', 'upstream.lock.json', 'scripts/build.py') }}
      - name: Native build
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python scripts/build.py --native
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: dist/gcpsim${{ matrix.ext }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Native real client tests
        run: |
          python scripts/test-cli.py 'dist/gcpsim${{ matrix.ext }}'
          python scripts/test-lifecycle.py 'dist/gcpsim${{ matrix.ext }}'
          python scripts/test-gcloud.py 'dist/gcpsim${{ matrix.ext }}'
          python scripts/test-auth.py 'dist/gcpsim${{ matrix.ext }}' 'dist/lmgcp${{ matrix.ext }}'
      - name: Package standalone binary
        run: |
          mkdir -p artifacts
          cp 'dist/gcpsim${{ matrix.ext }}' 'artifacts/gcpsim-${{ matrix.name }}${{ matrix.ext }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binary-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
  release:
    needs: native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts
      - name: Publish checked binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(cat VERSION)"
          cp LICENSE FLOCI-LICENSE upstream.lock.json artifacts/
          (cd artifacts && sha256sum * > SHA256SUMS)
          gh release create "$TAG" artifacts/* --verify-tag --title "gcpsim $TAG" --notes 'Standalone GCP emulator built from pinned floci-gcp 0.11.0. GCS and Pub/Sub tested with pinned lmgcp and gcloud on each published platform; opt-in bearer authentication and resource permissions. See README for defaults and limits.'
